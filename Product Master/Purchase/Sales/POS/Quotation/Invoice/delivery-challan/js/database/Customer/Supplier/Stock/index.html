<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAAD Engineering ERP - Stock Management</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:96%;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
margin-bottom:20px;
color:#0d47a1;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0d47a1;
color:white;
padding:10px;
border:1px solid #ccc;
}

td{
padding:8px;
border:1px solid #ccc;
}

input,select{
width:100%;
padding:8px;
border:1px solid #ccc;
border-radius:4px;
}

.buttons{
margin-top:20px;
}

button{
padding:10px 20px;
margin-right:10px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
}

.save{
background:#28a745;
color:white;
}

.edit{
background:#ffc107;
}

.delete{
background:#dc3545;
color:white;
}

.search{
background:#17a2b8;
color:white;
}

.print{
background:#6f42c1;
color:white;
}

.clear{
background:#6c757d;
color:white;
}

</style>

</head>

<body>

<div class="header">
SAAD Engineering ERP
</div>

<div class="container">

<h2>📦 Stock Management</h2>

<table>

<tr>
<th>Product Code</th>
<td><input type="text" value="PRD-000001"></td>

<th>Part Number</th>
<td><input type="text"></td>
</tr>

<tr>
<th>Product Name</th>
<td><input type="text"></td>

<th>Category</th>
<td>
<select>
<option>Generator Parts</option>
<option>Engine Parts</option>
<option>Electrical</option>
<option>Lubricant</option>
<option>Filter</option>
<option>Others</option>
</select>
</td>
</tr>

<tr>
<th>Brand</th>
<td><input type="text"></td>

<th>Unit</th>
<td>
<select>
<option>Pcs</option>
<option>Set</option>
<option>Litre</option>
<option>Kg</option>
</select>
</td>
</tr>

<tr>
<th>Opening Stock</th>
<td><input type="number"></td>

<th>Current Stock</th>
<td><input type="number"></td>
</tr>

<tr>
<th>Minimum Stock</th>
<td><input type="number"></td>

<th>Stock Value</th>
<td><input type="number"></td>
</tr>

<tr>
<th>Warehouse</th>
<td><input type="text"></td>

<th>Rack No</th>
<td><input type="text"></td>
</tr>

</table>

<div class="buttons">

<button class="save">💾 Save</button>

<button class="edit">✏️ Edit</button>

<button class="delete">🗑 Delete</button>

<button class="search">🔍 Search</button>

<button class="print">🖨 Print</button>

<button class="clear">❌ Clear</button>

</div>

</div>

</body>
</html>
